workflows:
  ios-build:
    name: iOS Build
    environment:
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          pod install || true
      - name: Build IPA
        script: |
          xcodebuild \
            -workspace "TurskaEV.xcworkspace" \
            -scheme "TurskaEV" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $CM_BUILD_DIR/TurskaEV.xcarchive \
            archive

          xcodebuild \
            -exportArchive \
            -archivePath $CM_BUILD_DIR/TurskaEV.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath $CM_BUILD_DIR
    artifacts:
      - "*.ipa"
